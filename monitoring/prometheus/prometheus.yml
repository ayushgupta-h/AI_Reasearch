global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "research-ai-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8000", "host.docker.internal:8000"]
        labels:
          app: "research-ai"
          component: "fastapi"

  - job_name: "research-ai-celery"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["celery:8000", "host.docker.internal:8000"]
        labels:
          app: "research-ai"
          component: "celery-worker"

