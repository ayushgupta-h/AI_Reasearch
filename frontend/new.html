<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Quest — new research</title>
<script>document.documentElement.classList.toggle('rm', matchMedia('(prefers-reduced-motion: reduce)').matches && new URLSearchParams(location.search).get('motion') !== 'full');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..500;1,9..144,300..500&family=Outfit:wght@300..500&display=swap" rel="stylesheet">
<script src="env.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<style>
/* ============================================================
   QUEST · NEW RESEARCH — tokens
============================================================ */
:root{
  --bg:#050505;
  --ink:#f4efe8;
  --amber:#e9c99b;
  --line:#2a2a2a;
  --lift:#0a0a09;
  --mut:rgba(244,239,232,.55);
  --mut2:rgba(244,239,232,.38);
  --serif:'Fraunces',Georgia,serif;
  --sans:'Outfit',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);
  font:300 16px/1.6 var(--sans);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  -webkit-tap-highlight-color:transparent;overflow:hidden;
}
::selection{background:var(--amber);color:#0b0906}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2f2f2c}
::-webkit-scrollbar-thumb:hover{background:var(--amber)}
:focus{outline:none}
:focus-visible{outline:1px solid var(--amber);outline-offset:2px}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block;flex:0 0 auto}

/* micro label */
.mlabel{
  font:500 10px/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;
  color:var(--mut2);
}

/* ============================================================
   SHELL
============================================================ */
.shell{
  height:100vh;display:grid;grid-template-columns:300px 1fr;
  transition:grid-template-columns .3s cubic-bezier(.22,1,.36,1);
  overflow:hidden;width:100vw;
}
.shell.rail-mode,.shell:has(.side.rail){grid-template-columns:64px 1fr}
.main{
  position:relative;display:flex;flex-direction:column;overflow:hidden;
  min-width:0;width:100%;height:100vh;
}
.main-body{
  flex:1 1 auto;min-height:0;position:relative;display:flex;flex-direction:column;
  overflow:hidden;width:100%;
}

/* ============================================================
   SIDEBAR
============================================================ */
.side{
  position:relative;z-index:20;display:flex;flex-direction:column;
  background:var(--lift);border-right:1px solid var(--line);
  min-height:0;overflow:hidden;overflow-x:hidden;
  transition:width .3s cubic-bezier(.22,1,.36,1);
  width:300px;min-width:0;
}
.side.rail{width:64px}
.side-head{
  display:flex;align-items:center;gap:10px;
  padding:20px 16px 14px;flex:0 0 auto;
}
.brand{display:flex;align-items:center;gap:9px;min-width:0;color:inherit;text-decoration:none}
.brand svg{width:20px;height:20px}
.wordmark{font:500 14px/1 var(--serif);letter-spacing:.4em;color:var(--ink);white-space:nowrap}
.head-btns{margin-left:auto;display:flex;gap:2px}
.ibtn{
  width:30px;height:30px;border-radius:7px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;color:var(--mut);
  transition:background-color .15s ease,color .15s ease;
}
.ibtn:hover{background:rgba(255,255,255,.05);color:var(--ink)}

/* Collapsed sidebar header */
.side.rail .side-head{flex-direction:column;align-items:center;gap:12px;padding:16px 0 12px}
.side.rail .brand{justify-content:center;margin:0}
.side.rail .wordmark,.side.rail .head-btns .search-btn{display:none !important}
.side.rail .head-btns{margin:0;display:flex;justify-content:center;width:100%}

/* inline search */
.side-search{padding:0 16px 10px;overflow:hidden;max-height:0;transition:max-height .45s var(--ease),padding .45s var(--ease)}
.side-search.open{max-height:44px;padding-bottom:12px}
.side-search input{
  width:100%;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:8px;
  font:300 12.5px/1 var(--sans);color:var(--ink);padding:9px 12px;
}
.side-search input::placeholder{color:var(--mut2)}
.side-search input:focus{border-color:rgba(233,201,155,.5);outline:none}
.side.rail .side-search{display:none !important}

.side-scroll{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:2px 10px 12px;position:relative;
}
.side-scroll::after{
  content:"";position:sticky;bottom:0;left:0;right:0;display:block;height:34px;pointer-events:none;
  background:linear-gradient(to top,var(--lift) 30%,transparent);
  margin-bottom:-8px;
}
.side.rail .side-scroll{padding:4px 6px 12px}

/* new research */
.newres{
  position:relative;width:100%;margin:2px 0 14px;padding:11px 14px;
  display:flex;align-items:center;gap:10px;overflow:hidden;isolation:isolate;
  border:1px solid rgba(255,255,255,.14);
  font:500 10px/1 var(--sans);letter-spacing:.26em;text-transform:uppercase;color:var(--ink);
  transition:border-color .15s ease,color .3s var(--ease);
}
.newres::before{
  content:"";position:absolute;inset:0;z-index:-1;background:var(--amber);
  transform:scaleX(0);transform-origin:right;transition:transform .5s var(--ease);
}
.newres:hover::before{transform:scaleX(1);transform-origin:left}
.newres:hover{color:#0b0906;border-color:var(--amber)}
.newres.active{border-color:rgba(233,201,155,.35);background:rgba(233,201,155,.04);box-shadow:inset 2px 0 0 var(--amber)}
.newres svg{width:14px;height:14px}
.side.rail .newres{
  justify-content:center;align-items:center;padding:0;
  width:44px;height:44px;margin:4px auto 14px;border-radius:10px;
}
.side.rail .newres .nr-label{display:none !important}
.side.rail .newres svg{margin:0}

/* nav rows */
.navrow{
  position:relative;width:100%;display:flex;align-items:center;gap:12px;
  padding:10px 12px;border-radius:8px;
  font:300 13.5px/1 var(--sans);color:var(--mut);
  transition:background-color .15s ease,color .15s ease,transform .2s var(--ease);
}
.navrow:hover{background:rgba(255,255,255,.04);color:var(--ink);transform:translateX(3px)}
.navrow.active{color:var(--ink)}
.navrow.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;background:var(--amber)}
.navrow.active svg{color:var(--amber)}
.navrow svg{width:16px;height:16px;color:var(--mut)}
.navrow .badge{
  margin-left:auto;min-width:16px;height:16px;padding:0 4px;
  display:flex;align-items:center;justify-content:center;
  font:500 9.5px/1 var(--sans);letter-spacing:0;
  background:rgba(233,201,155,.14);color:var(--amber);border-radius:4px;
}
.navrow .badge[hidden]{display:none}
.side.rail .navrow{
  justify-content:center;align-items:center;padding:0;
  width:44px;height:40px;margin:2px auto;border-radius:8px;transform:none !important;
}
.side.rail .navrow .nr-name,.side.rail .navrow .badge{display:none !important}

/* section lists */
.sect{margin-top:16px}
.sect-h{padding:0 12px 8px;display:flex;align-items:center;justify-content:space-between}
.showmore{
  font:500 9.5px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--mut2);
  transition:color .15s ease;
}
.showmore:hover{color:var(--amber)}
.srow{
  position:relative;width:100%;display:flex;align-items:center;gap:10px;
  padding:8px 12px;border-radius:8px;
  font:300 13px/1.4 var(--sans);color:var(--mut);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:background-color .15s ease,color .15s ease,transform .2s var(--ease),opacity .3s ease;
  text-align:left;
}
.srow:hover{background:rgba(255,255,255,.04);color:var(--ink);transform:translateX(3px)}
.srow.flash{background:rgba(233,201,155,.09)}
.srow .ric{width:14px;height:14px;color:var(--mut2);flex:0 0 auto}
.dim{opacity:.25}
.collapse-wrap{overflow:hidden;transition:height .5s var(--ease)}
.collapse-wrap > div{padding-top:2px}

/* Collapsed rail section adjustments */
.side.rail .sect{margin-top:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,.06)}
.side.rail .sect-h,.side.rail .showmore,.side.rail .collapse-wrap,.side.rail .side-empty{display:none !important}
.side.rail .srow{
  justify-content:center;align-items:center;padding:0;
  width:44px;height:38px;margin:2px auto;border-radius:8px;
  text-align:center;transform:none !important;
}
.side.rail .srow span:not(.ric){display:none !important}
.side.rail .srow .ric{margin:0;display:flex;align-items:center;justify-content:center}

/* toast */
.toast{
  position:fixed;left:50%;bottom:26px;z-index:950;
  transform:translateX(-50%) translateY(16px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:11px;
  background:#0c0c0b;border:1px solid #32302b;padding:12px 20px;
  font:400 12.5px/1.4 var(--sans);letter-spacing:.03em;color:var(--ink);
  max-width:min(88vw,480px);
  transition:transform .45s var(--ease),opacity .45s var(--ease);
}
.toast::before{content:"";width:5px;height:5px;background:var(--amber);flex:0 0 auto}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* ============================================================
   MAIN · top bar + toggle
============================================================ */
.topbar{
  position:absolute;top:0;left:0;right:0;height:64px;
  display:flex;align-items:center;gap:12px;padding:0 24px;
  z-index:30;pointer-events:none;
}
.hist-btn{pointer-events:auto;margin-left:auto}
.mob-shield{display:none;pointer-events:auto;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--lift);align-items:center;justify-content:center}
.mob-shield svg{width:18px;height:18px}

/* ============================================================
   MAIN · empty state
============================================================ */
.center{
  flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:80px 24px 32px;overflow-y:auto;position:relative;z-index:1;width:100%;box-sizing:border-box;
}
.main.docked-mode .center{display:none}
.greet{
  font:400 clamp(30px,4vw,46px)/1.15 var(--serif);letter-spacing:-.02em;
  text-align:center;max-width:820px;
}
.greet .gw{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.1em;margin-bottom:-.1em}
.greet .gw i{display:inline-block;font-style:normal;transform:translateY(115%);filter:blur(6px);transition:transform .9s var(--ease) calc(var(--i)*90ms + 120ms),filter .9s var(--ease) calc(var(--i)*90ms + 120ms)}
.greet.go .gw i{transform:none;filter:blur(0)}

/* ============================================================
   COMPOSER SLOT & BOTTOM DOCK
============================================================ */
.composer-slot{
  width:100%;display:flex;justify-content:center;
}
.bottom-dock{
  flex:0 0 auto;width:100%;display:none;justify-content:center;
  padding:12px 24px 20px;
  background:linear-gradient(to top, rgba(5,5,5,.98) 75%, rgba(5,5,5,0));
  z-index:30;border-top:1px solid rgba(255,255,255,.05);
  box-sizing:border-box;
}
.main.docked-mode .bottom-dock{display:flex}
.bottom-dock .composer-wrap{margin-top:0;opacity:1;transform:none}
.bottom-dock .hintrow{margin-top:6px}

/* ============================================================
   COMPOSER
============================================================ */
.composer-wrap{
  width:100%;max-width:780px;margin-top:34px;box-sizing:border-box;
  opacity:0;transform:translateY(16px);
  transition:opacity .8s var(--ease) 620ms,transform .8s var(--ease) 620ms;
}
.loaded .composer-wrap{opacity:1;transform:none}
.composer{
  display:flex;align-items:flex-end;gap:8px;
  border:1px solid rgba(255,255,255,.14);border-radius:28px;
  background:rgba(20,20,19,.75);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding:8px 10px 8px 12px;min-height:56px;box-sizing:border-box;
  transition:border-color .3s var(--ease),box-shadow .3s var(--ease),border-radius .3s var(--ease);
  position:relative;width:100%;
}
.composer:focus-within{border-color:rgba(233,201,155,.55);box-shadow:0 0 0 1px rgba(233,201,155,.18),0 8px 40px rgba(233,201,155,.06)}
.composer.docked{border-radius:24px}
.composer.docked.dock-pill{border-radius:28px}

.cplus{
  position:relative;width:40px;height:40px;border-radius:50%;flex:0 0 40px;margin:0;
  border:1px solid rgba(255,255,255,.16);color:var(--mut);background:transparent;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:border-color .15s ease,color .15s ease,background-color .15s ease;
}
.cplus:hover{border-color:rgba(233,201,155,.5);color:var(--amber)}
.cplus .cnt{
  position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;
  background:var(--amber);color:#0b0906;font:500 9.5px/16px var(--sans);text-align:center;
  display:none;
}
.cplus .cnt.show{display:block}
.cplus svg{width:15px;height:15px}

.cinput{
  flex:1 1 auto;min-width:0;border:0;background:transparent;resize:none;
  font:300 15px/1.45 var(--sans);color:var(--ink);
  min-height:40px;max-height:140px;padding:9px 4px 9px 6px;box-sizing:border-box;
  margin:0;outline:none;overflow-y:auto;
}
.cinput::placeholder{color:var(--mut2)}

.cdepth{
  position:relative;flex:0 0 auto;margin:0;height:40px;padding:0 12px;
  border-radius:20px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.03);
  font:400 12.5px/1 var(--sans);color:var(--mut);letter-spacing:.02em;
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;box-sizing:border-box;
  transition:color .15s ease,background-color .15s ease,border-color .15s ease;
}
.cdepth:hover{color:var(--ink);background:rgba(255,255,255,.06);border-color:rgba(233,201,155,.3)}
.cdepth svg{width:10px;height:10px;transition:transform .3s var(--ease)}
.cdepth[aria-expanded="true"] svg{transform:rotate(180deg)}

.csend{
  width:40px;height:40px;border-radius:50%;flex:0 0 40px;margin:0;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  border:1px solid rgba(255,255,255,.22);color:rgba(244,239,232,.35);background:transparent;
  transition:background-color .3s var(--ease),color .3s var(--ease),border-color .3s var(--ease),transform .15s var(--ease);
}
.csend:active{transform:scale(.94)}
.csend.ready{background:var(--amber);border-color:var(--amber);color:#0b0906}
.csend svg{width:16px;height:16px}

/* popovers above composer */
.cpop{
  position:absolute;bottom:calc(100% + 10px);left:8px;z-index:70;min-width:250px;
  background:#0e0e0c;border:1px solid var(--line);border-radius:12px;padding:10px;
  box-shadow:0 18px 50px rgba(0,0,0,.6);
  opacity:0;transform:translateY(6px);pointer-events:none;
  transition:opacity .3s var(--ease),transform .3s var(--ease);
}
.cpop.right{left:auto;right:8px}
.cpop.open{opacity:1;transform:none;pointer-events:auto}
.cpop .cpop-t{padding:2px 6px 8px}
.src-chips{display:flex;flex-wrap:wrap;gap:8px}
.schip{
  border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:7px 13px;
  font:500 9.5px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--mut);
  transition:all .2s var(--ease);
}
.schip:hover{border-color:rgba(233,201,155,.5);color:var(--ink)}
.schip[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:#0b0906}
.dmenu{min-width:250px}
.ditem{
  width:100%;text-align:left;display:flex;align-items:flex-start;gap:10px;
  padding:9px 10px;border-radius:8px;transition:background-color .15s ease;
}
.ditem:hover{background:rgba(255,255,255,.04)}
.ditem .dn{font:400 13px/1 var(--serif);color:var(--ink)}
.ditem .dd{font:300 11.5px/1.4 var(--sans);color:var(--mut2);margin-top:3px}
.ditem .dck{width:14px;height:14px;color:var(--amber);opacity:0;flex:0 0 auto;margin-top:2px}
.ditem[aria-checked="true"] .dck{opacity:1}

/* hint */
.hintrow{width:100%;display:flex;align-items:center;justify-content:center;gap:14px;margin-top:12px}
.hint{font:400 11px/1.5 var(--sans);letter-spacing:.06em;color:var(--mut2);text-align:center}

/* ============================================================
   SUGGESTIONS
============================================================ */
.sugg{
  width:100%;max-width:640px;margin-top:30px;
  display:flex;flex-direction:column;gap:20px;
  opacity:0;transform:translateY(14px);
  transition:opacity .8s var(--ease) 760ms,transform .8s var(--ease) 760ms;
}
.loaded .sugg{opacity:1;transform:none}
.sugg-row{
  position:relative;display:flex;align-items:flex-start;gap:12px;text-align:left;
  font:300 15px/1.5 var(--sans);color:var(--mut);
  transition:color .3s var(--ease),transform .3s var(--ease);
  padding-bottom:2px;
}
.sugg-row::after{
  content:"";position:absolute;left:26px;right:0;bottom:-4px;height:1px;
  background:var(--amber);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease);
}
.sugg-row:hover{color:var(--ink);transform:translateX(4px)}
.sugg-row:hover::after{transform:scaleX(1)}
.sugg-row svg{width:16px;height:16px;color:var(--amber);opacity:.55;margin-top:3px;transition:opacity .3s var(--ease)}
.sugg-row:hover svg{opacity:1}
.sugg-row span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ============================================================
   RUN VIEW
============================================================ */
.runview{
  flex:1 1 auto;min-height:0;display:none;
  flex-direction:column;align-items:center;
  padding:76px 24px 32px;overflow-y:auto;overflow-x:hidden;
  width:100%;box-sizing:border-box;position:relative;
}
.main.docked-mode .runview{display:flex}
.run-q{
  font:400 clamp(24px,3vw,38px)/1.25 var(--serif);letter-spacing:-.015em;
  text-align:center;max-width:760px;
}
.run-meta{margin-top:12px;font:400 10.5px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--mut2);text-align:center}
.run-card{
  width:100%;max-width:720px;margin-top:30px;
  border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.015);
  padding:20px 22px 16px;box-sizing:border-box;
}
.agents{display:flex;flex-direction:column}
.arow2{display:flex;align-items:center;gap:12px;padding:8px 2px}
.adot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;border:1px solid rgba(233,201,155,.35);transition:background-color .3s var(--ease),box-shadow .3s var(--ease),border-color .3s var(--ease)}
.arow2.running .adot{background:rgba(233,201,155,.4);border-color:var(--amber);box-shadow:0 0 8px rgba(233,201,155,.5);animation:apulse 1.1s ease-in-out infinite alternate}
@keyframes apulse{from{box-shadow:0 0 4px rgba(233,201,155,.3)}to{box-shadow:0 0 12px rgba(233,201,155,.7)}}
.arow2.done .adot{background:var(--amber);border-color:var(--amber);box-shadow:0 0 10px rgba(233,201,155,.7)}
.aname{font:400 14.5px/1 var(--serif)}
.acount{margin-left:auto;font:400 11px/1 var(--mono);color:var(--mut2);opacity:0;transition:opacity .3s var(--ease)}
.acount.show{opacity:1}
.alog{
  margin-top:14px;border-top:1px solid var(--line);padding-top:12px;
  font:400 11px/1.7 var(--mono);color:var(--mut);
  height:calc(8 * 1.7em);overflow:hidden;position:relative;
  display:flex;flex-direction:column;justify-content:flex-end;
}
.alog div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.queue-row{
  width:100%;max-width:720px;margin-top:14px;
  border:1px dashed rgba(255,255,255,.16);border-radius:12px;
  padding:12px 16px;font:400 11px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--mut2);
  text-align:center;transition:color .2s var(--ease),border-color .2s var(--ease),background-color .2s var(--ease);
  box-sizing:border-box;
}
.queue-row:hover{color:var(--ink);border-color:rgba(233,201,155,.4);background:rgba(255,255,255,.02)}
.queue-input-wrap{
  width:100%;max-width:720px;margin-top:10px;overflow:hidden;max-height:0;opacity:0;
  transition:max-height .5s var(--ease),opacity .4s var(--ease);box-sizing:border-box;
}
.queue-input-wrap.open{max-height:70px;opacity:1}
.queue-input{
  width:100%;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;
  font:300 14px/1.4 var(--sans);color:var(--ink);padding:12px 16px;box-sizing:border-box;
}
.queue-input::placeholder{color:var(--mut2)}
.queue-input:focus{border-color:rgba(233,201,155,.5);outline:none}
.qchips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px;max-width:760px}
.side-empty{font:300 11.5px/1.6 var(--sans);color:var(--mut2);padding:8px 2px 2px}
.qchip{
  display:flex;align-items:center;gap:8px;
  border:1px solid rgba(233,201,155,.3);border-radius:999px;background:rgba(233,201,155,.05);
  padding:7px 14px;font:300 12px/1.3 var(--sans);color:var(--ink);
}
.qchip .qdot{width:7px;height:7px;border-radius:50%;border:1px solid rgba(233,201,155,.5)}
.qchip.running .qdot{background:rgba(233,201,155,.5);border-color:var(--amber);animation:apulse 1.1s ease-in-out infinite alternate}
.qchip.done .qdot{background:var(--amber);border-color:var(--amber)}
.draft{
  width:100%;max-width:720px;margin-top:18px;box-sizing:border-box;
  border:1px solid rgba(233,201,155,.35);border-radius:14px;background:rgba(233,201,155,.04);
  padding:20px 22px;
  opacity:0;transform:translateY(18px);transition:opacity .6s var(--ease),transform .6s var(--ease);
}
.draft.show{opacity:1;transform:none}
.draft .dq{font:italic 400 17px/1.5 var(--serif);color:var(--amber)}
.draft .db{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
.dopen{
  background:var(--amber);color:#0b0906;border-radius:999px;padding:11px 20px;
  font:500 10.5px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;
  transition:transform .15s var(--ease),box-shadow .3s var(--ease);
}
.dopen:hover{box-shadow:0 6px 24px rgba(233,201,155,.25)}
.dopen:active{transform:scale(.97)}
.dagain{
  border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:11px 20px;
  font:500 10.5px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--ink);
  transition:border-color .2s var(--ease),background-color .2s var(--ease);
}
.dagain:hover{border-color:rgba(233,201,155,.5);background:rgba(233,201,155,.05)}

/* ============================================================
   RESPONSIVE
============================================================ */
.backdrop{
  position:fixed;inset:0;z-index:40;background:rgba(3,3,3,.6);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity .5s var(--ease);
}
.backdrop.on{opacity:1;pointer-events:auto}
@media (max-width:900px){
  .shell{grid-template-columns:1fr !important}
  .shell.rail-mode{grid-template-columns:1fr !important}
  .side{
    position:fixed;top:0;left:0;bottom:0;width:300px;
    transform:translateX(-100%);transition:transform .5s var(--ease);
    box-shadow:20px 0 60px rgba(0,0,0,.5);
  }
  .side.open{transform:none}
  .side.rail{width:300px;transform:translateX(-100%)}
  .side.rail.open{transform:none}
  .side.rail .side-head{flex-direction:row;gap:10px;padding:20px 16px 14px}
  .side.rail .wordmark{display:inline !important}
  .side.rail .head-btns{display:flex;margin-left:auto;width:auto}
  .side.rail .head-btns .search-btn{display:flex !important}
  .side.rail .navrow{justify-content:flex-start;padding:10px 12px;width:100%}
  .side.rail .navrow .nr-name{display:inline !important}
  .side.rail .newres{justify-content:flex-start;padding:11px 14px;width:100%}
  .side.rail .newres .nr-label{display:inline !important}
  .side.rail .sect-h{display:flex !important}
  .side.rail .showmore{display:inline !important}
  .side.rail .srow{justify-content:flex-start;padding:8px 12px;width:100%}
  .side.rail .srow span:not(.ric){display:inline !important}
  .mob-shield{display:flex}
  .center{padding-top:120px}
  .runview{padding-top:110px}
  .greet{font-size:clamp(26px,6.4vw,34px)}
  .composer{padding:8px 8px 8px 10px;gap:6px}
  .cdepth{display:none}
  .hintrow{flex-direction:column-reverse;gap:8px}
  .bottom-dock{padding:8px 12px 14px}
}

/* ============================================================
   REDUCED MOTION
============================================================ */
html.rm *,html.rm *::before,html.rm *::after{
  transition-duration:.001ms !important;transition-delay:0ms !important;
  animation-duration:.001ms !important;animation-iteration-count:1 !important;
}
html.rm .greet .gw i{transform:none;filter:none}
html.rm .composer-wrap,html.rm .sugg{opacity:1;transform:none}
html.rm .alog div{white-space:normal}

/* ============ page-to-page veil (shared Quest transition) ============ */
.veil{
  position:fixed;inset:0;z-index:200;pointer-events:none;
  background:#050505;
  opacity:0;visibility:hidden;
  transition:opacity .1s ease,visibility 0s linear .1s;
}
.veil.on{opacity:1;visibility:visible;transition:opacity .1s ease,visibility 0s}
html.rm .veil{transition:none}
</style>
</head>

<script>
(() => {
'use strict';
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const REDUCED = document.documentElement.classList.contains('rm');

/* ================= data ================= */
const SESSIONS = {
  pinned: ['Grid-scale battery storage economics', 'Semiconductor export controls timeline'],
  projects: ['EU AI Act — enforcement watch', 'Coral reef restoration methods'],
  projectsMore: ['Vertical farming unit economics', 'Municipal broadband outcomes since 2020'],
  recents: ['Deep-sea mining regulations', 'Sleep debt and next-day cognition', 'Solid-state battery race']
};
const SUGG_RES = [
  { icon: 'doc',   text: 'How do housing subsidies actually affect rents?' },
  { icon: 'scale', text: 'Compare grid-scale battery storage technologies and their economics' },
  { icon: 'stack', text: 'What are the latest breakthroughs in quantum error correction?' },
  { icon: 'doc',   text: 'Map the current state of CRISPR clinical trials and access costs' }
];
const API = localStorage.getItem('questApi') || 'http://127.0.0.1:8000';
let activeProvider = 'groq';
fetch(API + '/providers')
  .then(r => r.json())
  .then(d => { if (d && d.default) activeProvider = d.default; })
  .catch(() => {});
const basename = p => (p || '').split(/[\\/]/).pop();
/* real pipeline stages — server agent labels map onto these rows */
const AGENTS = ['Strategist', 'Searcher', 'Reader', 'Analyst', 'Writer', 'Critic', 'Refiner', 'Exporter'];
const AGENT_ROW = { 'Strategist': 0, 'Search Engine': 1, 'Deep Reader': 2, 'Analyst': 3, 'Report Writer': 4, 'Critic': 5, 'Refiner': 6, 'Exporter': 7, 'Citation Validator': 7, 'Multi-Format Export': 7 };
const ICONS = {
  doc:   '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 1.8h5.5L13 5.3v8.9H4V1.8Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M9.3 1.8v3.6H13M6 8.2h4.6M6 10.8h4.6" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>',
  scale: '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2v11.5M3 13.5h10M8 3.5 3.5 5m4.5-1.5L12.5 5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/><path d="M1.8 8.6c0 1.2.8 2.1 1.7 2.1s1.7-.9 1.7-2.1L3.5 5.2 1.8 8.6ZM10.8 8.6c0 1.2.8 2.1 1.7 2.1s1.7-.9 1.7-2.1L12.5 5.2l-1.7 3.4Z" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg>',
  stack: '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m8 1.8 6.2 3.2L8 8.2 1.8 5 8 1.8Z" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/><path d="m1.8 8.2 6.2 3.2 6.2-3.2M1.8 11.2l6.2 3.2 6.2-3.2" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  folder:'<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M1.8 4c0-.9.7-1.6 1.6-1.6h2.8l1.4 1.6h5c.9 0 1.6.7 1.6 1.6v6.4c0 .9-.7 1.6-1.6 1.6H3.4c-.9 0-1.6-.7-1.6-1.6V4Z" stroke="currentColor" stroke-width="1.1"/></svg>'
};

/* ================= state ================= */
let depth = 'Standard';
const srcOn = { Web: true, News: true, Academic: true, Reports: false };
let running = false;
let runAbort = null;
let runNum = 0;
let queued = null;
let queuedRunning = false;

/* ================= toast ================= */
let toastTimer = 0;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

/* ================= sidebar build ================= */
function row(text, icon) {
  const b = document.createElement('button');
  b.className = 'srow';
  b.type = 'button';
  b.title = text;
  if (icon) b.insertAdjacentHTML('beforeend', '<span class="ric">' + ICONS[icon] + '</span>');
  const s = document.createElement('span');
  s.textContent = text;
  b.appendChild(s);
  b.addEventListener('click', () => {
    b.classList.add('flash');
    setTimeout(() => b.classList.remove('flash'), 350);
    cinput.value = text;
    try { autoGrow(); sendState(); } catch (_) {}
    cinput.focus();
    toast('Loaded into the composer — review it, then run.');
  });
  return b;
}
SESSIONS.pinned.forEach(t => $('#pinnedList').appendChild(row(t)));
SESSIONS.projects.forEach(t => $('#projectsList').appendChild(row(t, 'folder')));
SESSIONS.projectsMore.forEach(t => $('#projectsMore').appendChild(row(t, 'folder')));
SESSIONS.recents.forEach(t => $('#recentsList').appendChild(row(t)));

/* empty states — sections stay in the DOM but hide until real sessions exist */
$('#pinnedList').closest('.sect').hidden = !SESSIONS.pinned.length;
$('#projectsList').closest('.sect').hidden = !SESSIONS.projects.length && !SESSIONS.projectsMore.length;
if (!SESSIONS.projectsMore.length) $('#showMore').hidden = true;
if (!SESSIONS.recents.length) {
  const e = document.createElement('p');
  e.className = 'side-empty';
  e.textContent = 'No sessions yet — runs you start will appear here.';
  $('#recentsList').appendChild(e);
}

/* live sessions from the backend replace the empty note when available */
fetch(API + '/sessions').then(r => r.ok ? r.json() : Promise.reject()).then(d => {
  const ss = (d.sessions || []).slice(0, 6);
  if (!ss.length) return;
  const list = $('#recentsList');
  list.innerHTML = '';
  ss.forEach(s => {
    const b = document.createElement('button');
    b.className = 'srow';
    b.type = 'button';
    b.title = s.topic;
    b.insertAdjacentHTML('beforeend', '<span class="ric">' + ICONS.doc + '</span>');
    const sp = document.createElement('span');
    sp.textContent = s.topic;
    b.appendChild(sp);
    b.addEventListener('click', () => {
      const url = 'report.html?run=' + encodeURIComponent(basename(s.saved_report_path)) + '&topic=' + encodeURIComponent(s.topic);
      window.__nav ? __nav(url) : location.href = url;
    });
    list.appendChild(b);
  });
}).catch(() => { /* backend offline — keep the empty note */ });

/* show more projects */
const projMore = $('#projMore');
$('#showMore').addEventListener('click', () => {
  const open = $('#showMore').getAttribute('aria-expanded') === 'true';
  if (open) {
    projMore.style.height = projMore.scrollHeight + 'px';
    requestAnimationFrame(() => { projMore.style.height = '0'; });
    $('#showMore').setAttribute('aria-expanded', 'false');
    $('#showMore').textContent = 'Show more';
    setTimeout(() => { projMore.hidden = true; }, 520);
  } else {
    projMore.hidden = false;
    projMore.style.height = '0';
    requestAnimationFrame(() => { projMore.style.height = projMore.scrollHeight + 'px'; });
    $('#showMore').setAttribute('aria-expanded', 'true');
    $('#showMore').textContent = 'Show less';
    setTimeout(() => { projMore.style.height = 'auto'; }, 520);
  }
});

/* search filter */
const searchBtn = $('#searchBtn'), sideSearch = $('#sideSearch'), searchInput = $('#searchInput');
searchBtn.addEventListener('click', () => {
  const open = sideSearch.classList.toggle('open');
  searchBtn.setAttribute('aria-expanded', String(open));
  if (open) setTimeout(() => searchInput.focus(), 180);

/* ================= submit / dock ================= */
const composer = $('#composer'), composerWrap = $('#composerWrap');
const centerCol = $('#centerCol'), runview = $('#runview');
const mainArea = $('#mainArea') || $('.main');
const centerSlot = $('#centerComposerSlot');
const bottomDock = $('#bottomDock');

function dockComposer() {
  mainArea.classList.add('docked-mode');
  if (bottomDock && composerWrap.parentElement !== bottomDock) {
    bottomDock.appendChild(composerWrap);
  }
  composer.classList.add('docked', 'dock-pill');
}

function submit() {
  const q = cinput.value.trim();
  if (!q || running) return;
  if (window.QuestAuth && !QuestAuth.isAuthenticated()) {
    QuestAuth.requireAuth(() => {
      running = true;
      runNum++;
      closePops();
      dockComposer();
      cinput.value = '';
      autoGrow();
      sendState();
      startRun(q);
    }, 'Sign in with Google to start research and save private reports.');
    return;
  }
  running = true;
  runNum++;
  closePops();
  dockComposer();
  cinput.value = '';
  autoGrow();
  sendState();
  startRun(q);
}
csend.addEventListener('click', submit);

/* ================= research run ================= */
function startRun(q) {
  $('#runQ').textContent = q;
  const srcList = Object.keys(srcOn).filter(k => srcOn[k]);
  $('#runMeta').textContent = 'depth: ' + depth.toLowerCase() + ' · sources: ' + (srcList.join(' + ') || 'none') + ' · run #' + runNum;
  const agentsBox = $('#agents');
  agentsBox.innerHTML = AGENTS.map((a, i) =>
    '<div class="arow2" data-i="' + i + '"><span class="adot" aria-hidden="true"></span><span class="aname">' + a + '</span><span class="acount" data-c="' + i + '"></span></div>'
  ).join('');
  $('#alog').innerHTML = '';
  $('#draft').classList.remove('show');
  $('#qchips').innerHTML = '';
  queued = null; queuedRunning = false;
  $('#queueWrap').classList.remove('open');

  running = true;
  const log = $('#alog');
  const srcCounter = $('[data-c="1"]');

  /* ---- live SSE run against the FastAPI backend ---- */
  if (runAbort) runAbort.abort();
  runAbort = new AbortController();
  const mark = (idx) => {
    AGENTS.forEach((_, i) => {
      const r = $('.arow2[data-i="' + i + '"]');
      if (!r) return;
      r.classList.remove('running');
      if (i < idx) r.classList.add('done');
    });
    const cur = $('.arow2[data-i="' + idx + '"]');
    if (cur) { cur.classList.remove('done'); cur.classList.add('running'); }
  };
  const logBuf = [];
  let logRaf = 0;
  function flushLog() {
    logRaf = 0;
    const lines = logBuf.splice(0, logBuf.length);
    const frag = document.createDocumentFragment();
    lines.forEach(line => {
      const d = document.createElement('div');
      d.textContent = line;
      frag.appendChild(d);
    });
    log.appendChild(frag);
    while (log.children.length > 8) log.removeChild(log.firstChild);
  }
  const appendLog = (line) => {
    logBuf.push(line);
    if (!logRaf) logRaf = requestAnimationFrame(flushLog);
    const m = line.match(/Retrieved (\d+) unique/);
    if (m) { srcCounter.textContent = m[1] + ' sources'; srcCounter.classList.add('show'); }
  };
  let doneFile = '', doneScore = null;

  const authHeaders = window.QuestAuth ? QuestAuth.getAuthHeaders() : {};
  fetch(API + '/research', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', ...authHeaders },
    body: JSON.stringify({
      topic: q,
      provider: activeProvider || 'groq',
      max_revisions: depth === 'Deep' ? 2 : depth === 'Quick' ? 0 : 1,
      approval_threshold: depth === 'Deep' ? 8 : depth === 'Quick' ? 6 : 7
    }),
    signal: runAbort.signal
  }).then(res => {
    if (!res.ok || !res.body) throw new Error('backend returned ' + res.status);
    const rd = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    const onEvent = (ev, d) => {
      if (ev === 'agent_start' && d.agent && d.agent in AGENT_ROW) {
        mark(AGENT_ROW[d.agent]);
        if (AGENT_ROW[d.agent] === 1) { srcCounter.textContent = '0 sources'; srcCounter.classList.add('show'); }
      } else if (ev === 'progress') {
        if (d.message) appendLog(d.message);
      } else if (ev === 'complete') {
        const data = d.data || {};
        doneFile = basename(data.saved_report_path);
        doneScore = data.critic_score;
        mark(AGENTS.length);
      } else if (ev === 'error') {
        throw new Error(d.message || 'pipeline error');
      }
    };
    return (function pump() {
      return rd.read().then(({ value, done }) => {
        if (done) return;
        buf += dec.decode(value, { stream: true });
        let cut;
        while ((cut = buf.indexOf('\n\n')) !== -1) {
          const chunk = buf.slice(0, cut); buf = buf.slice(cut + 2);
          let ev = 'progress', data = '';
          chunk.split('\n').forEach(line => {
            if (line.indexOf('event:') === 0) ev = line.slice(6).trim();
            else if (line.indexOf('data:') === 0) data += line.slice(5).trim();
          });
          if (!data) continue; /* keepalive comment */
          let parsed = null;
          try { parsed = JSON.parse(data); } catch (_) { continue; }
          onEvent(ev, parsed);
        }
        return pump();
      });
    })();
  }).then(() => {
    if (doneFile) $('.dopen').href = 'report.html?run=' + encodeURIComponent(doneFile) + '&topic=' + encodeURIComponent(q);
    else $('.dopen').href = 'report.html?topic=' + encodeURIComponent(q);
    $('.dopen').style.display = '';
    $('#draftQ').textContent = doneScore != null
      ? 'Report ready — the critic scored it ' + doneScore + '/10.'
      : 'Report ready.';
    $('#draft').classList.add('show');
    running = false;
    if (queued) { const next = queued; queued = null; runNum++; startRun(next); }
  }).catch(err => {
    if (err && err.name === 'AbortError') return;
    const msg = (err && /Failed to fetch|NetworkError|load failed/i.test(err.message || ''))
      ? 'backend unreachable at ' + API + ' — start it with: uvicorn server:app --port 8000'
      : (err && err.message) || 'unknown error';
    appendLog('error: ' + msg);
    const cur = $('.arow2.running');
    if (cur) cur.classList.remove('running');
    $('.dopen').style.display = 'none';
    $('#draftQ').textContent = 'Run failed — ' + msg;
    $('#draft').classList.add('show');
    running = false;
    toast('Research failed: ' + msg);
  });

}

/* queue another */
$('#queueRow').addEventListener('click', () => {
  $('#queueWrap').classList.toggle('open');
  $('#queueInput').focus();
});
$('#queueInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') {

    /* idle desk: start it for real right away */
    if (!running) {
      chip.remove();
      queued = null;
      runNum++;
      closePops();
      dockComposer();
      startRun(v);
    }
  }
});

function resetToEmpty() {

  $('.dopen').style.display = '';

    centerSlot.appendChild(composerWrap);

  composer.classList.remove('docked', 'dock-pill');

  $('#alog').innerHTML = '';
  $('#qchips').innerHTML = '';

}

/* ================= pops + keys ================= */
function closePops() {
  if (srcPop.classList.contains('open')) { srcPop.classList.remove('open'); cplus.setAttribute('aria-expanded', 'false'); cplus.focus(); }
  if (depthPop.classList.contains('open')) { depthPop.classList.remove('open'); cdepth.setAttribute('aria-expanded', 'false'); cdepth.focus(); }
}
document.addEventListener('pointerdown', e => {
  if (!e.target.closest('#cplus') && !e.target.closest('#srcPop') && srcPop.classList.contains('open')) { srcPop.classList.remove('open'); cplus.setAttribute('aria-expanded', 'false'); }
  if (!e.target.closest('#cdepth') && !e.target.closest('#depthPop') && depthPop.classList.contains('open')) { depthPop.classList.remove('open'); cdepth.setAttribute('aria-expanded', 'false'); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closePops();
    if (side.classList.contains('open')) { side.classList.remove('open'); backdrop.classList.remove('on'); }
    return;
  }
  const typing = e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA');
  if (e.key === '/' && !typing) { e.preventDefault(); cinput.focus(); }
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); submit(); }
});

/* ================= deep link ================= */
function deepLink() {
  const p = new URLSearchParams(location.search);
  const q = p.get('q');
  if (!q) { if (p.get('focus') === '1') setTimeout(() => cinput.focus(), REDUCED ? 60 : 500); return false; }
  cinput.value = q;
  autoGrow();
  sendState();
  if (p.get('run') === '1') setTimeout(submit, REDUCED ? 60 : 1400);
  else cinput.focus();
  return true;
}

/* sidebar stagger */
$$('.side .navrow, .side .sect, .side .newres').forEach((el, i) => {
  el.style.opacity = '0';

  el.style.transition = 'opacity .6s cubic-bezier(.22,1,.36,1) ' + (i * 40) + 'ms,transform .6s cubic-bezier(.22,1,.36,1) ' + (i * 40) + 'ms';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    el.style.opacity = '1';
    el.style.transform = 'none';

buildGreet();
buildSugg();
autoGrow();
const linked = deepLink();
if (!linked) setTimeout(() => cinput.focus(), REDUCED ? 30 : 1300);

});

})();

<script>
/* ============ shared Quest page-veil: smooth page-to-page hand-off ============ */
(function(){
  'use strict';
  var veil = document.getElementById('veil');
  if (!veil) return;
  var rm = document.documentElement.classList.contains('rm');
  var REDUCED = rm && new URLSearchParams(location.search).get('motion') !== 'full';

  window.__nav = function(url){
    if (!url || url.charAt(0) === '#') return;
    if (REDUCED) { location.href = url; return; }
    veil.classList.add('on');
    setTimeout(function(){ location.href = url; }, 100);
  };

  /* intercept in-page <a> clicks to same-origin .html targets */
  document.addEventListener('click', function(e){
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var a = e.target.closest('a[href]');
    if (!a || a.target === '_blank' || a.hasAttribute('download')) return;
    var href = a.getAttribute('href');
    if (!href || href.charAt(0) === '#') return;
    if (!/\.html(\?|$|#)/.test(href) && href.indexOf('/') !== -1) return;
    if (!/\.html/.test(href)) return;
    if (a.origin !== location.origin) return;
    if (a.pathname === location.pathname && a.search === location.search) return; /* same page: real anchor jump */
    e.preventDefault();
    window.__nav(href);
  }, false);

  /* arriving: quick unveil */
  veil.classList.add('on');
  var unveil = function(){
    veil.classList.remove('on');
    if (window.__scrollOnLoad) window.__scrollOnLoad();
  };
  if (document.readyState === 'complete') setTimeout(unveil, 60);
  else window.addEventListener('load', function(){ setTimeout(unveil, 60); });
})();
</script>

<script>
/* ============ shared Quest lens-scroll: damped wheel, expo-lerped glide ============ */
(function(){
  'use strict';
  if (window.__lens) return;
  var rm = document.documentElement.classList.contains('rm');
  var REDUCED = rm && new URLSearchParams(location.search).get('motion') !== 'full';
  if (REDUCED) return;                       /* reduced motion: native scrolling only */
  if (window.matchMedia && matchMedia('(pointer:coarse)').matches) return; /* touch: native momentum */

  function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
  function maxScroll(el){ return Math.max(0, el.scrollHeight - el.clientHeight); }

  /* a nested scrollable between the wheel target and our container that can
     absorb the wheel keeps native behavior (sheet body, side lists, textareas) */
  function nestedScrollable(node, cont, dir){
    var n = node;
    while (n && n !== cont){
      if (n.nodeType === 1){
        var oy = getComputedStyle(n).overflowY;
        if ((oy === 'auto' || oy === 'scroll') && n.scrollHeight > n.clientHeight + 4){
          if (dir < 0 ? n.scrollTop > 1 : n.scrollTop < n.scrollHeight - n.clientHeight - 1) return true;
        }
      }
      n = n.parentElement;
    }
    return false;
  }

  function lens(el){
    if (!el || el.__lens) return;
    el.__lens = true;
    var target = el.scrollTop, current = target, lastWritten = target;
    var lastNow = 0, raf = 0;

    function frame(now){
      raf = 0;
      var dt = clamp((now - lastNow) / 1000, 0.0001, 0.05);
      lastNow = now;
      var ms = maxScroll(el);
      if (target > ms) target = ms;
      var gap = Math.abs(target - current);
      var k = gap > (el.clientHeight || 400) * 0.25 ? 8 : 6.2;   /* adaptive response */
      current += (target - current) * (1 - Math.exp(-dt * k));   /* frame-rate independent */
      if (Math.abs(target - current) < 0.35) current = target;
      if (Math.abs(current - lastWritten) > 0.05){
        el.scrollTop = current;                                  /* instant per spec */
        lastWritten = current;
      }
      if (current !== target) raf = requestAnimationFrame(frame);
    }
    function kick(){ if (!raf){ lastNow = performance.now(); raf = requestAnimationFrame(frame); } }

    el.addEventListener('wheel', function(e){
      if (e.ctrlKey || e.deltaY === 0) return;                    /* pinch-zoom / horizontal: native */
      if (el.scrollHeight <= el.clientHeight + 4) return;
      if (nestedScrollable(e.target, el, e.deltaY)) return;
      e.preventDefault();
      var d = e.deltaY;
      if (e.deltaMode === 1) d *= 16;
      else if (e.deltaMode === 2) d *= el.clientHeight || 400;
      target = clamp(target + d, 0, maxScroll(el));
      kick();
    }, { passive: false });

    /* keyboard feeds the same damped target — nothing snaps */
    el.addEventListener('keydown', function(e){
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      var t = e.target;
      if (t && t !== el && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      var d = 0;
      if (e.key === 'ArrowDown') d = 90;
      else if (e.key === 'ArrowUp') d = -90;
      else if (e.key === 'PageDown' || e.key === ' ') d = el.clientHeight * 0.85;
      else if (e.key === 'PageUp') d = -el.clientHeight * 0.85;
      else if (e.key === 'Home'){ target = 0; e.preventDefault(); kick(); return; }
      else if (e.key === 'End'){ target = maxScroll(el); e.preventDefault(); kick(); return; }
      if (!d) return;
      e.preventDefault();
      target = clamp(target + d, 0, maxScroll(el));
      kick();
    });

    /* scrollbar drags, autoscroll, find-in-page, anchor restore -> resync */
    el.addEventListener('scroll', function(){
      var y = el.scrollTop;
      if (Math.abs(y - lastWritten) > 1.5) current = target = lastWritten = y;
    }, { passive: true });
  }

  window.__lens = lens;
  var TARGETS = ['#sideScroll', '#runview'];
  TARGETS.forEach(function(sel){
    var el = sel === null ? (document.scrollingElement || document.documentElement) : document.querySelector(sel);
    if (el) lens(el);
  });
})();
</script>
