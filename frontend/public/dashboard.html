<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Quest — Redirecting</title>
  <script>
    (function() {
      var hash = window.location.hash || '';
      var search = window.location.search || '';
      
      // If returning with OAuth tokens in hash
      if (hash && hash.indexOf('access_token') !== -1) {
        var params = new URLSearchParams(hash.replace(/^#\/?/, ''));
        var accessToken = params.get('access_token');
        var refreshToken = params.get('refresh_token');
        var expiresIn = params.get('expires_in');
        var tokenType = params.get('token_type');
        
        if (accessToken) {
          localStorage.setItem('quest_access_token', accessToken);
          var storageKey = 'sb-vxqalflbzpjkvmtbbqrv-auth-token';
          var sessionObj = {
            access_token: accessToken,
            refresh_token: refreshToken || '',
            expires_in: Number(expiresIn) || 3600,
            expires_at: Math.floor(Date.now() / 1000) + (Number(expiresIn) || 3600),
            token_type: tokenType || 'bearer',
            user: null
          };
          try {
            var parts = accessToken.split('.');
            if (parts.length === 3) {
              var payload = JSON.parse(atob(parts[1].replace(/-/g, '+').replace(/_/g, '/')));
              sessionObj.user = {
                id: payload.sub,
                aud: payload.aud,
                role: payload.role,
                email: payload.email,
                app_metadata: payload.app_metadata || {},
                user_metadata: payload.user_metadata || {}
              };
            }
          } catch(e) {}
          localStorage.setItem(storageKey, JSON.stringify(sessionObj));
          localStorage.setItem('quest_active_session', JSON.stringify(sessionObj));
        }
      }
      
      // Immediately replace location to new React UI workspace
      window.location.replace('./index.html#/app/new');
    })();
  </script>
</head>
<body style="background:#0A0908;margin:0;"></body>
</html>
