[pytest]
# ─── Test discovery ───────────────────────────────────────────────────────────
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ─── Output ───────────────────────────────────────────────────────────────────
addopts =
    -v
    --tb=short
    --color=yes
    --strict-markers

# ─── Markers ─────────────────────────────────────────────────────────────────
markers =
    slow: marks tests that hit real network or disk (deselect with -m "not slow")
    integration: marks end-to-end tests requiring API keys

# ─── Ignore paths ────────────────────────────────────────────────────────────
norecursedirs =
    .venv
    __pycache__
    chroma_db
    reports
    .git
